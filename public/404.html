<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Long Hoàng Logistics</title>
    <script>
      (function() {
        var path = window.location.pathname || '';
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        if (path.indexOf('console') !== -1 || hash.indexOf('console') !== -1 || search.indexOf('console') !== -1) {
          window.location.replace('/?console=1' + (search ? '&' + search.slice(1) : '') + hash);
        } else {
          window.location.replace('/' + search + hash);
        }
      })();
    </script>
  </head>
  <body style="font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f8fafc; color: #334155;">
    <div style="text-align: center;">
      <p style="font-size: 16px; font-weight: 500;">Đang chuyển hướng đến Long Hoàng Logistics...</p>
    </div>
  </body>
</html>
