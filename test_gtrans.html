<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
</head>
<body>
  <h1>Xin chào thế giới</h1>
  <p>Vận tải đường biển quốc tế.</p>
  <div id="google_translate_element" style="display:none;"></div>
  
  <button onclick="setLang('en')">English</button>
  <button onclick="setLang('zh-CN')">Chinese</button>
  <button onclick="setLang('vi')">Vietnamese</button>
  
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({pageLanguage: 'vi', includedLanguages: 'en,zh-CN,vi', autoDisplay: false}, 'google_translate_element');
    }
    
    function setLang(lang) {
      if (lang === 'vi') {
        document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
        document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=" + window.location.hostname;
      } else {
        document.cookie = "googtrans=/vi/" + lang + "; path=/; domain=" + window.location.hostname;
        document.cookie = "googtrans=/vi/" + lang + "; path=/;";
      }
      window.location.reload();
    }
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
